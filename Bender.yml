# K9R5: Cheshire SoC (CVA6 + Ara) on FPGA.
#
# Cheshire (branch mp/ara-pulp-v2) is the base SoC. Bender.local overrides
# Cheshire's pins so this repo's ara/ and cva6/ submodules are used instead.
#
# Spatz pins older versions of several shared packages (axi =0.39.1-beta,
# register_interface 0.3, riscv-dbg 0.7, axi_riscv_atomics 0.7); Bender.local
# and the generated Bender.lock use the newer of Cheshire's and Spatz's.

package:
  name: k9r5

dependencies:
  cheshire: { path: cheshire }
  spatz:    { path: spatz }

# K9R5: Cheshire SoC (CVA6 + Ara) on FPGA.
#
# Cheshire (branch mp/ara-pulp-v2) is the base SoC. Bender.local overrides
# Cheshire's pins so this repo's ara/ and cva6/ submodules are used instead.
#
# Spatz pins older versions of several shared packages (axi =0.39.1-beta,
# register_interface 0.3, riscv-dbg 0.7, axi_riscv_atomics 0.7); Bender.local
# and the generated Bender.lock use the newer of Cheshire's and Spatz's.

package:
  name: k9r5

dependencies:
  cheshire: { path: cheshire }
  spatz:    { path: spatz }
  # Direct dependencies for their include dirs (cheshire/typedef.svh needs
  # axi/ and register_interface/); versions as in Bender.local
  axi:                { git: "https://github.com/pulp-platform/axi.git",                version: 0.39.6 }
  register_interface: { git: "https://github.com/pulp-platform/register_interface.git", version: 0.4.4  }

sources:
  - hw/k9r5_pkg.sv
  - hw/k9r5_spatz.sv
  # Verilator testbench (`make k9r5-sim-build`)
  - target: verilator
    files:
      - target/sim/verilator/tb_k9r5_vlt.sv
